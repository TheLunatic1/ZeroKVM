<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Let clicks pass through */
    }

    .highlight {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,210,255,0.8) 0%, rgba(58,123,213,0.4) 50%, rgba(0,0,0,0) 80%);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      animation: pulse 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('play-highlight', (event, { x, y }) => {
      const circle = document.createElement('div');
      circle.className = 'highlight';
      circle.style.left = x + 'px';
      circle.style.top = y + 'px';
      
      document.body.appendChild(circle);
      
      // Remove it after the animation finishes
      setTimeout(() => {
        if (document.body.contains(circle)) {
          document.body.removeChild(circle);
        }
      }, 500);
    });
  </script>
</body>
</html>
